/* ===== UI2: readable game chrome. The page stays the star; the chrome is a calm browser/devtools shell. ===== */
body.ui2{--left:304px;--right:344px;--ink:#23242a;--sub:#5b5e6a;--mute:#8a8d98;--line:#e2e3e8;--card:#fff;--bg:#eceef2;--you:#2fb47c;--foe:#e5484d;font-size:13px;color:var(--ink);background:var(--bg);font-family:'Segoe UI','Hiragino Sans','Noto Sans JP','Yu Gothic UI',Meiryo,sans-serif}

.tb-stats{display:flex;align-items:center;gap:22px;margin-left:auto}.tb-money{font:700 22px Arial;color:#f5c542;white-space:nowrap;display:flex;align-items:baseline;gap:2px}.tb-money small{font:600 11px 'Segoe UI',sans-serif;color:#9a9ca8;margin-right:6px}
.tb-cpu{display:flex;align-items:center;gap:8px;color:#b9bbc6;white-space:nowrap}.tb-cpu small{font:700 10px Arial;letter-spacing:1px;color:#9a9ca8}.cpu-track{width:120px;height:8px;background:#34363f;border-radius:4px;overflow:hidden}.cpu-track i{display:block;height:100%;background:#5fb3ff;transition:width .2s}.tb-cpu.over .cpu-track i{background:var(--foe)}.tb-cpu b{font:600 14px Arial;color:#fff}.tb-cpu.over b{color:#ff8a8a}

 if(!(info.member[l.id]||[]).some(g=>g.items.includes(nav.id)))return {n:4,text:'ナビを青いリンクの<b>真横</b>まで寄せると、ピタッと連結します。',rect:[Math.min(784,l.x+l.w),l.y,nav.w,l.h,'ここまで寄せる']};
 if(!run.tutorialAck)return {n:5,panel:true,text:'連結した！ 右の<b>シナジー</b>に「ナビゲーション 速度 +15%」。さらに同じサイトのUIが3つで<b>セット効果</b>も発動中です。',next:'次へ'};
 return {n:6,button:true,text:'準備完了。右上の<b>▶ 公開して対戦</b>で、相手のサイトと閲覧者を奪い合おう。'};}
function renderCoach(){const el=$('#coach'),s=tutStep();for(const t of $$('.tut-target'))t.classList.remove('tut-target');const layer=$('#tut-layer');if(layer)layer.innerHTML='';
 if(!s){el.hidden=true;return;}
 el.hidden=false;el.classList.toggle('in-battle',!!battle);el.innerHTML=`<span class="coach-step">${s.label||(s.n<=6?`STEP ${s.n}`:'TIPS')}</span><span class="coach-text">${s.text}</span>${s.next?`<button id="tut-next" class="coach-next">${s.next}</button>`:''}${battle?'':'<button id="tut-skip" class="coach-skip">スキップ</button>'}`;
 if(s.card)$(`#library-list [data-palette-type="${s.card}"]`)?.classList.add('tut-target');if(s.panel)$('#inspector .synergy')?.classList.add('tut-target');if(s.button)$('#battle-button').classList.add('tut-target');
 if(s.rect&&layer){const [x,y,w,hh,label]=s.rect;layer.innerHTML=`<div class="tut-drop" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px"><span>${esc(label)}</span></div>`;}}
function render(){document.body.classList.toggle('preview-mode',preview);document.body.classList.toggle('battle-mode',!!battle);document.body.classList.toggle('battling',!!battle&&!paused);$('#battle-controls').hidden=!battle;$('#battle-log').hidden=!battle;$('#canvas-float').hidden=!!battle||view==='enemy';const back=$('#back-to-page');back.hidden=!!battle||!(view==='enemy'||preview);back.textContent=preview?'✎ 編集に戻る':'← 自分のサイトに戻る';
 renderTopbar();renderFrames();if(!battle){renderShop();renderSide();}else fx.update(battle);renderCoach();}

/* ---------- Modals ---------- */
function openModal(html){$('#modal-content').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();}
function closeModal(){$('#modal').close();}
function modalHead(kicker,title){return `<div class="modal-head"><div><div class="modal-kicker">${esc(kicker)}</div><h2>${esc(title)}</h2></div><button data-close-modal aria-label="閉じる">×</button></div>`;}
function help(){openModal(`<div class="modal-inner">${modalHead('HOW TO PLAY','遊び方')}<div class="howto"><div><b>1</b><p><strong>他のサイトからUIを移植する</strong>左の「巡回先のサイト」からUIをドラッグして、自分のページへコピー。移植には資金がかかり、資金は対戦中の収益で増えます。</p></div><div><b>2</b><p><strong>くっつけて連結する</strong>ボタン同士、検索窓＋ボタン、動画＋シークバー。連結すると強くなります。</p></div><div><b>3</b><p><strong>同じサイトのUIを3つ</strong>YouTube・Amazonなど、同じサイト文化のUIを3つ置くとセット効果。右の「シナジー」で確認。</p></div><div><b>4</b><p><strong>公開して対戦</strong>相手のサイトと閲覧者を奪い合います。勝つと相手のUIを奪えます。</p></div><div><b>5</b><p><strong>重さと処理能力</strong>UIを置くほどページは重くなります。サーバーの処理能力を超えると表示が遅くなり、閲覧者が待ちきれずに離れていく。巡回先にたまに出る「レンタルサーバー」で処理能力を増やそう。</p></div><div><b>6</b><p><strong>8つのサイトに挑む</strong>負けるとライフが1つ減ります（3つ）。</p></div></div><p class="muted">操作：Shift＋クリックで複数選択 / G：まとまりを選択 / Alt：くっつき無効 / Delete：手持ちへ / Ctrl+Z：元に戻す</p><div class="modal-footer"><button data-close-modal class="primary">わかった</button></div></div>`);}
function menu(){const hasCamp=(()=>{try{return !!localStorage.getItem(KEY+'campaign');}catch{return false;}})();
 openModal(`<div class="modal-inner">${modalHead('MENU','メニュー')}<div class="menu-grid">
 <button id="m-campaign" class="${run.mode==='campaign'?'on':''}"><b>▶ ラン${hasCamp?'を続ける':'を始める'}</b><small>8つのサイトに挑む本編</small></button>
 <button id="m-new-campaign"><b>↺ 新しいラン</b><small>真っ白なページから</small></button>
 <button id="m-tutorial"><b>🎓 チュートリアル</b><small>最初から手順つきで</small></button>
 <button id="m-lab" class="${run.mode==='lab'?'on':''}"><b>🧪 実験室</b><small>全UIを無料で試す</small></button>
 <button id="m-preview"><b>◉ サイトを触ってみる</b><small>検索窓やボタンを操作</small></button>
 <button id="m-help"><b>？ 遊び方</b><small>ルールと操作</small></button>
 <button id="m-settings"><b>✎ サイト名とヘッダー</b><small>${esc(run.page.name)}</small></button></div>
 ${run.mode==='lab'?`<div class="menu-row"><label>ページのお手本<select id="preset-select" class="select-input"><option value="">選んで読み込む</option>${Object.entries(D.PRESETS).map(([id,p])=>`<option value="${id}">${esc(p.name)}</option>`).join('')}</select></label><button id="export-button" class="side-btn">構成を書き出す</button><button id="import-button" class="side-btn">読み込む</button></div>`:''}
 <div class="menu-row"><label><input id="motion-setting" type="checkbox" ${fx.reduced?'checked':''}> モーションを抑える</label><label><input id="sound-setting" type="checkbox" ${fx.sound?'checked':''}> 効果音</label></div></div>`);}
function settings(){openModal(`<div class="modal-inner">${modalHead('SITE','サイト名とヘッダー')}<label class="field-label">サイト名<input class="text-input" id="page-name" maxlength="40" value="${esc(run.page.name)}"></label><label class="field-label">ヘッダーのデザイン<select id="page-theme" class="select-input">${[['mixed','ごちゃ混ぜ'],...Object.entries(D.FACTIONS).map(([k,v])=>[k,v.name+'風'])].map(([v,t])=>`<option value="${v}" ${v===run.page.theme?'selected':''}>${esc(t)}</option>`).join('')}</select></label><div class="modal-footer"><button data-close-modal class="primary">閉じる</button></div></div>`);}
function resultModal(s){const win=s.winner==='player',camp=run.mode==='campaign',v=s.visitors||{player:0,enemy:0},tot=Math.max(1,v.player+v.enemy),best=(s.stats||[]).filter(p=>p.damage>0).slice(0,3);
 const next=run.phase==='reward'?'<button id="reward-next" class="primary">🎁 報酬を選ぶ</button>':run.phase==='gameover'||run.phase==='complete'?'<button id="finish-next" class="primary">ランの結果へ</button>':camp?`<button id="result-edit" class="primary">次のラウンドへ（ROUND ${run.stage+1}）</button>`:'<button id="result-replay">もう一度</button><button id="result-edit" class="primary">編集に戻る</button>';
 openModal(`<div class="modal-inner result ${win?'win':'lose'}">${modalHead(s.round?`ROUND ${s.round}`:'TEST BATTLE',win?'勝利！ 閲覧者を奪い取った':s.winner==='draw'?'引き分け':'敗北…閲覧者を奪われた')}
 <div class="res-share"><div><small>あなた</small><b>${v.player}人</b></div><div class="res-bar"><i style="width:${100*v.player/tot}%"></i></div><div class="foe"><small>${esc(s.enemy)}</small><b>${v.enemy}人</b></div></div>
 ${camp?`<div class="res-money"><div><span>基本収入</span><b>+$${s.base}</b></div><div><span>勝利ボーナス</span><b>+$${s.bonus}</b></div><div><span>サイト収益：戦闘中に稼いだ $${s.rawIncome} の半分（上限 $10）</span><b>+$${s.income}</b></div><div class="sum"><span>所持金</span><b>$${run.cash}</b></div></div>${!win&&run.lives>0?`<p class="res-note">ライフ残り ${'♥'.repeat(run.lives)}。次のラウンドに進みます。</p>`:''}`:''}
 ${best.length?`<h4>活躍したUI</h4><div class="res-mvp">${best.map((p,i)=>`<div><em>${i+1}</em><b>${esc(P[p.type]?.name||'UI')}</b><span>${s.visitors?`約${Math.max(1,Math.round(p.damage/s.visitors.max*s.visitors.base))}人を奪取`:Math.round(p.damage)+'ダメージ'} ・ ${p.fires}回発動</span></div>`).join('')}</div>`:''}
 <div class="result-actions">${next}</div></div>`);}
function rewardModal(){const pending=run.pending;if(!pending)return;
 openModal(`<div class="modal-inner">${modalHead('REWARD','相手のサイトから1つ奪う')}<p>選んだUIは「手持ち」に入ります。設備は管理画面に入ります。</p><div class="reward-grid">${pending.loot.map(k=>{if(k.startsWith('admin:')){const id=k.slice(6),a=D.ADMIN[id];return `<button class="reward-card admin" data-loot="${k}"><span class="rc-tag">管理画面の設備</span><div class="rc-vis dark">${adminViz(id,'player')}</div><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></button>`;}const d=P[k],f=D.FACTIONS[d.faction];return `<button class="reward-card" data-loot="${k}"><span class="rc-tag"><i style="background:${f.color}"></i>${esc(f.name)}・${KIND[d.kind]}</span><div class="rc-vis" data-loot-visual="${k}"></div><b>${esc(d.name)}</b><small>${esc(shortDesc(d))}</small><em>${esc(connectText(k))}</em></button>`;}).join('')}</div><div class="modal-footer"><button data-loot="skip">何も取らずに進む</button></div></div>`);
 $$('[data-loot-visual]').forEach(el=>{const p=P[el.dataset.lootVisual],n=V.palettePreview(p.id);n.style.transform=`scale(${Math.min(190/p.w,70/p.h,1)})`;el.append(n);});}
function finishModal(){const done=run.phase==='complete';openModal(`<div class="modal-inner">${modalHead(done?'RUN COMPLETE':'RUN OVER',done?'すべてのサイトに挑み終えた！':'ライフが尽きた…')}<div class="res-money"><div><span>勝利数</span><b>${run.wins} / ${R.ROUNDS}</b></div><div><span>到達ラウンド</span><b>${Math.min(run.stage+1,R.ROUNDS)}</b></div><div><span>最終ページのUI</span><b>${run.owned.filter(C.placed).length}個</b></div></div><p>最後に作ったページはそのまま残っています。</p><div class="result-actions"><button id="go-lab">実験室へ</button><button id="new-campaign" class="primary">新しいランを始める</button></div></div>`);}

/* ---------- Battle ---------- */
function start(){if(battle)return;if(run.phase==='reward'){rewardModal();return;}if(['complete','gameover'].includes(run.phase)){finishModal();return;}preBattle=clone(run);save();const result=R.startBattle(run);if(!result.ok){toast(result.error);preBattle=null;return;}battle=result.battle;settling=false;paused=false;speed=1;fx.reset();lastTime=performance.now();preview=false;view='self';manualZoom=null;editor.selection.clear();editor.pending=null;coachHidden=true;$('#pause-button').textContent='一時停止';$$('[data-speed]').forEach(b=>b.classList.toggle('active',b.dataset.speed==='1'));render();traffic.start(battle);requestAnimationFrame(tick);}
function tick(now){if(!battle)return;const delta=Math.max(0,Math.min(.1,(now-lastTime)/1000));lastTime=now;traffic.speed=speed;traffic.paused=paused;if(!paused&&!battle.result){const events=battle.step(delta*speed);for(const ev of events){fx.emit(ev,battle);traffic.event(ev);}fx.update(battle);$('#battle-clock').textContent=battle.elapsed.toFixed(1)+'s';}
 if(battle.result&&!settling){settling=true;const current=battle;setTimeout(()=>{if(battle===current)finishBattle();},2600);}else if(!battle.result)requestAnimationFrame(tick);}
function abort(){if(!battle||battle.result)return;battle=null;settling=false;fx.clear();traffic.stop();if(preBattle)run=preBattle;preBattle=null;preview=false;view='self';paused=false;save();render();toast('対戦をやめて、編集に戻りました。');}
function finishBattle(){if(!battle)return;const visitors=traffic.active?{...traffic.final(),base:traffic.base.enemy,max:battle.enemy.maxHp}:null;const result=R.settleBattle(run,battle);if(!result.ok){toast(result.error);return;}fx.update(battle);document.body.classList.remove('battling');editor.history=[];editor.future=[];const s=result.summary;s.visitors=visitors;save();resultModal(s);}
function leaveBattle(){battle=null;settling=false;preBattle=null;fx.clear();traffic.stop();view='self';preview=false;manualZoom=null;closeModal();render();}
function exportFile(){const copy=clone(run);const blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ui-raid-page.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('構成JSONを書き出しました。');}
async function importFile(file){if(!file)return;try{if(file.size>300000)throw new Error('構成ファイルが大きすぎます。');const parsed=JSON.parse(await file.text());if(!R.validateRun(parsed))throw new Error('このバージョンの有効な構成JSONではありません。');save();run=parsed;editor.reset();preview=false;view='self';save();render();toast('構成を読み込みました。');}catch(e){toast(e.message||'読み込めませんでした。');}$('#import-file').value='';}
function switchMode(mode,fresh=false,tutorial=!tutorialDone()){if(battle)return;save();run=fresh?R.newRun(mode,'mixed',{tutorial:mode==='campaign'&&tutorial}):load(mode);preview=false;view='self';editor.reset();closeModal();save();render();if(run.phase==='reward')rewardModal();else if(['complete','gameover'].includes(run.phase))finishModal();}
function previewAction(e){const act=e.target.closest('[data-ui]'),body=e.target.closest('.browser-paper');if(!body||!act)return;if(act.tagName==='A')e.preventDefault();if(!preview||battle)return;const node=act.closest('.web-node');if(node)fx.pulse(node);
 const kind=act.dataset.ui;if(kind==='subscribe'){act.textContent=act.textContent==='登録済み'?'メンバーになる':'登録済み';act.classList.toggle('is-on');}else if(kind==='like'){const n=act.querySelector('.like-value');if(n)n.textContent=+n.textContent+1;}else if(['caption','notify','wish'].includes(kind)){act.classList.toggle('is-on');}else if(kind==='play'){node.classList.toggle('video-paused');}else if(['page','tab','font'].includes(kind)){for(const b of act.parentElement.querySelectorAll('button'))b.classList.remove('current');act.classList.add('current');}else if(kind==='accordion'){const c=act.closest('.native-accordion'),is=c.classList.toggle('collapsed');act.querySelector('span').textContent=is?'＋':'−';}else if(kind==='buy'){const cart=body.querySelector('.cart-state');if(cart)cart.textContent=+cart.textContent+1;toast('カートに追加しました（実際の購入はしません）。');}else if(kind==='submit'){const form=node.closest('.node-gov_form')?.querySelector('.native-form');if(form)form.classList.add('accepted');}else if(kind==='link'||kind==='header'||kind==='download')toast('ページ内のプレビューです。外部には移動しません。');}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{previewAction(e);if(e.target.closest('#enemy-thumbnail')&&!battle){view='enemy';render();return;}const target=e.target.closest('button');if(!target)return;
 if(target.hasAttribute('data-close-modal')){closeModal();if(battle?.result)leaveBattle();return;}
 if(target.dataset.editorAction){const a=target.dataset.editorAction;if(['horizontal','vertical'].includes(a))editor.join(a);else editor[a]?.();return;}
 if(target.dataset.shape){editor.update({shape:target.dataset.shape});return;}if(target.dataset.skinAll){editor.updateAll({shape:target.dataset.skinAll});return;}if(target.dataset.speed){speed=+target.dataset.speed;$$('[data-speed]').forEach(b=>b.classList.toggle('active',b===target));return;}
 if(target.dataset.plan){if(editor.commit(()=>R.purchase(run,'plan:'+target.dataset.plan)))toast(`サーバーを契約。処理能力が ${R.capacity(run)} になりました。`);return;}
 if(target.dataset.adminAdd!==undefined){if(!battle&&run.phase==='build')adminPicker();return;}
 if(target.dataset.adminPick){const id=target.dataset.adminPick;closeModal();editor.commit(()=>{const list=run.admin||[];if(list.length>=R.adminSlots(run)||list.includes(id))return{ok:false,error:'スロットが埋まっています。'};run.admin=[...list,id];return true;},`管理画面に「${D.ADMIN[id].name}」を導入しました。`);return;}
 if(target.dataset.adminRemove){const id=target.dataset.adminRemove;editor.commit(()=>{run.admin=(run.admin||[]).filter(a=>a!==id);return true;},`「${D.ADMIN[id].name}」を外しました。`);return;}
 if(target.dataset.loot){const k=target.dataset.loot,out=R.claimLoot(run,k==='skip'?null:k);if(!out.ok){toast(out.error);return;}save();leaveBattle();if(run.phase==='complete')finishModal();else toast(out.admin?`管理画面に「${D.ADMIN[out.admin].name}」を導入しました。`:out.item?`「${P[out.item.type].name}」を手持ちに加えました。ページにドラッグして使おう。`:`ROUND ${run.stage+1} へ。`);return;}
 switch(target.id){
  case'menu-button':menu();break;case'battle-button':start();break;case'undo-button':editor.undo();break;case'redo-button':editor.redo();break;
  case'zoom-in':manualZoom=Math.min(1.5,(manualZoom??parseInt($('#zoom-value').textContent.replace('FIT ',''))/100)+.1);scheduleFit();break;case'zoom-out':manualZoom=Math.max(.25,(manualZoom??parseInt($('#zoom-value').textContent.replace('FIT ',''))/100)-.1);scheduleFit();break;case'zoom-value':manualZoom=null;scheduleFit();break;
  case'view-enemy':view='enemy';render();break;case'back-to-page':view='self';preview=false;render();break;case'dismiss-coach':coachHidden=true;renderCoach();break;
  case'reroll-button':editor.commit(()=>R.reroll(run));break;case'export-button':exportFile();break;case'import-button':$('#import-file').click();break;
  case'pause-button':if(battle&&!battle.result){paused=!paused;$('#pause-button').textContent=paused?'再開':'一時停止';document.body.classList.toggle('battling',!paused);}break;case'abort-button':abort();break;
  case'result-edit':leaveBattle();break;case'result-replay':leaveBattle();start();break;case'reward-next':rewardModal();break;case'finish-next':leaveBattle();finishModal();break;
  case'new-campaign':leaveBattle();switchMode('campaign',true);break;case'go-lab':leaveBattle();switchMode('lab');break;
  case'm-campaign':switchMode('campaign');break;case'm-new-campaign':switchMode('campaign',true);break;case'm-lab':switchMode('lab');break;case'm-tutorial':switchMode('campaign',true,true);break;
  case'tut-next':{const s=tutStep();if(s?.n===5){run.tutorialAck=true;save();render();}else if(s?.n===7)finishTutorial();break;}case'tut-skip':finishTutorial();break;case'm-help':help();break;case'm-settings':settings();break;case'm-preview':closeModal();preview=true;editor.selection.clear();render();break;}
});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='part-label'){editor.update({label:el.value});return;}if(el.id==='page-name'){run.page.name=el.value.trim()||'mixspace.';save();render();return;}if(el.id==='page-theme'){run.page.theme=el.value;save();render();return;}
 if(el.id==='preset-select'&&el.value){const id=el.value;closeModal();editor.commit(()=>{const stage=run.stage,fresh=R.newRun('lab',id);fresh.stage=stage;fresh.admin=run.admin||[];if(id==='commerce'){fresh.page.theme='amazon';fresh.page.name='mixstore.';}else if(id==='form'){fresh.page.theme='gov';fresh.page.name='電子申請のページ';}Object.assign(run,fresh);editor.selection.clear();return true;},'お手本を読み込みました。Ctrl+Zで戻せます。');return;}
 if(el.id==='enemy-select'){run.stage=+el.value;save();render();return;}if(el.id==='family-filter')renderShop();if(el.id==='import-file')importFile(el.files[0]);if(el.id==='motion-setting'){fx.reduced=el.checked;document.body.classList.toggle('reduced-motion',fx.reduced);}if(el.id==='sound-setting'){fx.sound=el.checked;fx.tone('income');}});
$('#library-query').addEventListener('input',renderShop);
document.addEventListener('input',e=>{if(preview&&e.target.matches('.native-seek input'))e.target.closest('.web-node').style.setProperty('--seek',e.target.value/100);});
document.addEventListener('submit',e=>{if(e.target.closest('.browser-paper')){e.preventDefault();if(preview)toast('「'+(e.target.querySelector('input')?.value||'UI')+'」を検索（ページ内の操作デモ）');}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches?.('[data-palette-type]'))editor.add(e.target.dataset.paletteType);if(e.key==='Enter'&&e.target.matches?.('#enemy-thumbnail')&&!battle){view='enemy';render();}if(e.code==='Space'&&battle&&!e.target.closest?.('input,button,select,textarea')&&!$('#modal').open){e.preventDefault();$('#pause-button').click();}});
$('#modal').addEventListener('cancel',()=>{if(battle?.result)setTimeout(leaveBattle,0);});
new ResizeObserver(scheduleFit).observe($('#canvas-scroll'));window.addEventListener('resize',scheduleFit);window.addEventListener('beforeunload',save);
window.UIRaidApp=Object.freeze({inspect:()=>({run:clone(run),view,preview,selected:[...editor.selection],battle:battle?{time:battle.elapsed,result:battle.result,playerHp:battle.player.hp,enemyHp:battle.enemy.hp,playerIncome:battle.player.income}:null})});
if(run.mode==='campaign'&&!run.history.length&&!run.owned.length&&!tutorialDone()&&!run.tutorial)run=R.newRun('campaign','mixed',{tutorial:true});
render();save();if(run.phase==='reward')rewardModal();else if(['complete','gameover'].includes(run.phase))finishModal();
})();

</script>
</body></html>
